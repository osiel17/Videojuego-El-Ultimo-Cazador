<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Último Cazador</title>

    <link rel="stylesheet" href="style/inicio.css">
</head>

<body>

    <div class="pantalla-inicio">

        <!-- FONDO OSCURO -->
        <div class="fondo-oscuro"></div>

        <!-- NIEBLA ANIMADA -->
        <div class="niebla niebla1"></div>
        <div class="niebla niebla2"></div>
        <div class="niebla niebla3"></div>

        <!-- PARTÍCULAS DEL PORTAL -->
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>
        <div class="particula p5"></div>
        <div class="particula p6"></div>

        <!-- TÍTULO DEL JUEGO -->
        <h1 class="titulo-juego">
            EL ÚLTIMO CAZADOR
        </h1>

        <!-- SUBTÍTULO -->
        <p class="subtitulo">
            El ascenso del cazador comienza...
        </p>

        <!-- PORTAL -->
        <div class="portal">
            <div class="portal-centro"></div>
        </div>

        <!-- PERSONAJE -->
        <img 
            src="img/personaje/h0.png" 
            class="cazador"
            alt="Cazador"
        >

        <!-- ZONA DE CARGA -->
        <div class="zona-carga">

            <p class="texto-cargando">
                Cargando aventura...
            </p>

            <div class="barra-carga">
                <div class="barra-progreso"></div>
            </div>

        </div>

        <!-- BOTÓN PARA INICIAR -->
        <a href="menu-principal.html" class="boton-jugar">
         Iniciar Juego
    </a>

    <script>
        alert(' PARA UNA MEJOR EXPERIENCIA USE EL MODO PANTALLA COMPLETA HACIENDO CLICK EN F11 O DESDE LAS OPCIONES DEL NAVEGADOR')
    </script>
